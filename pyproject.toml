[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-surgical-agent"
version = "3.1.0.dev0"
description = "Strict-causal CholecTrack20 Streaming SurgicalAgent V3.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ivtmetrics==0.1.5",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10.0,<13",
    "PyYAML>=6.0,<7",
    "scikit-learn>=1.3,<2",
    "scipy>=1.12,<2",
    "torch>=2.1,<3",
]

[project.optional-dependencies]
dataset = [
    "requests>=2.31",
    "synapseclient>=4.7",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"surgical_agent.perception.prompts" = ["*.txt", "*.json"]
"surgical_agent.research.signals.resources" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "integration: tests spanning multiple project components",
    "local_data: tests requiring an external local dataset",
]
