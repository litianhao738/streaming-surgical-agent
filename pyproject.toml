[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-surgical-agent"
version = "3.1.0.dev0"
description = "Strict-causal CholecTrack20 Streaming SurgicalAgent V3.1"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

# Retain existing install extras as aliases; all dependencies come from one file.
[project.optional-dependencies]
dataset = []
dev = []

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"surgical_agent.perception.prompts" = ["*.txt", "*.json"]
"surgical_agent.research.signals.resources" = ["*.csv"]
"surgical_agent.research.verification.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "integration: tests spanning multiple project components",
    "local_data: tests requiring an external local dataset",
]
